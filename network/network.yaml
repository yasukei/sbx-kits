# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: yasukei/sbx-kits/network
description: My common network allow list

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - deb.debian.org
          - code.claude.com
          - snapshot.debian.org
          - fonts.bunny.net
          - packages.sury.org
          - laravel.com
          - boost.laravel.com
          - www.postgresql.org
          - apt.postgresql.org
