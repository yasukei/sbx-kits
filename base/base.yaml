# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: yasukei/sbx-kits/base
description: My base config

capabilities:
  - type: com.docker.sandbox/git-identity@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - deb.debian.org
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -eu
            git config --global --unset-all url."https://github.com/".insteadOf || true
            git config --global --add url."https://github.com/".insteadOf "git@github.com:"
            git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
            git config --global --add url."https://github.com/".insteadOf "git://github.com/"
          user: "1000"
          description: Rewrite GitHub SSH/git URLs to HTTPS
        - command: git config --global core.pager less
          user: "1000"
          description: Use less as the git pager (Debian's default 'pager' is missing)
        - command: |
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends shellcheck
          user: "0"
          description: Install shellcheck

